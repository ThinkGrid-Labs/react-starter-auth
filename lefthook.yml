pre-commit:
  parallel: true
  commands:
    # Scoped to the library source: the example apps have their own eslint
    # configs that cannot resolve from this root.
    lint:
      glob: "src/**/*.{ts,tsx}"
      run: pnpm eslint {staged_files}
    typecheck:
      glob: "src/**/*.{ts,tsx}"
      run: pnpm typecheck
